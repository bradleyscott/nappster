<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8D8FF"/>
      <stop offset="100%" stop-color="#CDB2FF"/>
    </linearGradient>
    <linearGradient id="pacifierGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FCF97"/>
      <stop offset="100%" stop-color="#4CAF74"/>
    </linearGradient>
  </defs>

  <!-- White circular background -->
  <circle cx="100" cy="100" r="96" fill="#FFFFFF"/>

  <!-- Lavender outer ring stroke -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#B48BFF" stroke-width="8"/>

  <!-- Headphones band -->
  <path d="M 42 102 C 42 52 158 52 158 102" fill="none" stroke="#B48BFF" stroke-width="12" stroke-linecap="round"/>
  <path d="M 42 102 C 42 52 158 52 158 102" fill="none" stroke="#D8C6FF" stroke-width="5" stroke-linecap="round"/>

  <!-- Headphone ear cups -->
  <rect x="26" y="84" width="24" height="44" rx="11" fill="url(#headphoneGrad)" stroke="#B48BFF" stroke-width="3"/>
  <rect x="150" y="84" width="24" height="44" rx="11" fill="url(#headphoneGrad)" stroke="#B48BFF" stroke-width="3"/>

  <!-- Face outline -->
  <ellipse cx="100" cy="106" rx="48" ry="52" fill="none" stroke="#2D2B3A" stroke-width="4"/>

  <!-- Hair curl -->
  <path d="M 88 62 C 84 48 104 46 104 60 C 104 70 96 72 98 84" fill="none" stroke="#2D2B3A" stroke-width="4" stroke-linecap="round"/>

  <!-- Closed eyes -->
  <path d="M 72 102 Q 82 110 92 102" fill="none" stroke="#2D2B3A" stroke-width="4" stroke-linecap="round"/>
  <path d="M 108 102 Q 118 110 128 102" fill="none" stroke="#2D2B3A" stroke-width="4" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M 92 124 Q 100 132 108 124" fill="none" stroke="#2D2B3A" stroke-width="4" stroke-linecap="round"/>

  <!-- Pacifier -->
  <circle cx="100" cy="140" r="11" fill="url(#pacifierGrad)" stroke="#2D2B3A" stroke-width="3"/>
  <circle cx="93" cy="134" r="2.5" fill="#FFFFFF"/>
  <circle cx="107" cy="134" r="2.5" fill="#FFFFFF"/>
  <path d="M 100 151 L 100 162" fill="none" stroke="#2D2B3A" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 88 162 Q 100 170 112 162" fill="none" stroke="#2D2B3A" stroke-width="3.5" stroke-linecap="round"/>
</svg>